name: Deploy Quasar SPA to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build-and-deploy-external:
    concurrency:
      group: quasar-gh-pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: VersionControl1/package-lock.json

      - name: Install dependencies (VersionControl1)
        working-directory: VersionControl1
        run: npm ci

      - name: Build Quasar SPA (PUBLIC_PATH=/VersionControl1/)
        working-directory: VersionControl1
        env:
          PUBLIC_PATH: /VersionControl1/
        run: npx quasar build

      - name: Deploy to GitHub Pages (external repo somnuk2/VersionControl1)
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GH_PAT }}
          external_repository: somnuk2/VersionControl1
          publish_branch: gh-pages
          publish_dir: VersionControl1/dist/spa
          keep_files: false
