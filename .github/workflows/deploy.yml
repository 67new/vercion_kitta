name: CI/CD Quasar + Pages + Playwright

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Build the Quasar app to dist/spa for local E2E
      - name: Install app dependencies
        working-directory: VersionControl1
        run: npm ci

      - name: Build Quasar SPA
        working-directory: VersionControl1
        run: npx quasar build

      # Setup Playwright project and browsers
      - name: Install test dependencies
        working-directory: Playwright
        run: npm install

      - name: Install Playwright browsers
        working-directory: Playwright
        run: npx playwright install --with-deps

      - name: Run Playwright tests (local dist)
        working-directory: Playwright
        run: npx playwright test --reporter=line

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Playwright/playwright-report
          retention-days: 7

  build-and-deploy:
    needs: test
    concurrency:
      group: quasar-gh-pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: VersionControl1/package-lock.json

      - name: Install dependencies (VersionControl1)
        working-directory: VersionControl1
        run: npm ci

      - name: Build Quasar SPA (VersionControl1)
        working-directory: VersionControl1
        run: npx quasar build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: VersionControl1/dist/spa
